<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>VEX 科技图标</title>
  <desc>VEX brand icon - minimalist monogram with neon glow</desc>

  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1320"/>
      <stop offset="100%" stop-color="#06080F"/>
    </radialGradient>

    <linearGradient id="vexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DF0CE"/>
      <stop offset="100%" stop-color="#1FA8FF"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#vignette)"/>

  <g opacity="0.18" stroke="#1FA8FF" stroke-width="0.4" fill="none">
    <line x1="0" y1="0" x2="0" y2="256"/>
    <line x1="0" y1="0" x2="256" y2="0"/>
  </g>

  <g opacity="0.35">
    <rect x="22" y="22" width="212" height="212" rx="44"
          fill="none" stroke="#1FA8FF" stroke-width="1.2"/>
  </g>

  <g transform="translate(128 138)" text-anchor="middle"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
     font-weight="900"
     fill="url(#vexGrad)"
     filter="url(#neonGlow)">
    <text font-size="148" letter-spacing="-6">VEX</text>
  </g>

  <g transform="translate(128 200)" text-anchor="middle">
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="600" letter-spacing="8"
          fill="#5DF0CE" opacity="0.85">VISION · ENGINE · X</text>
  </g>

  <circle cx="58" cy="58" r="2" fill="#5DF0CE" opacity="0.9"/>
  <circle cx="198" cy="58" r="2" fill="#5DF0CE" opacity="0.9"/>
  <circle cx="58" cy="198" r="2" fill="#5DF0CE" opacity="0.9"/>
  <circle cx="198" cy="198" r="2" fill="#5DF0CE" opacity="0.9"/>
</svg>
